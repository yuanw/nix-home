name: "build"
on:
  pull_request:
  push:
jobs:
  mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          experimental-features = nix-command flakes pipe-operators
    - uses: cachix/cachix-action@v17
      with:
        name: yuanwang-wf
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    # Public CI must not fetch nix-home-private (private GitHub repo). blank/
    # stubs the input; see flake.nix comment on nix-home-private.
    #https://github.com/github/roadmap/issues/528
    - run: nix develop --override-input nix-home-private path:$PWD/blank
