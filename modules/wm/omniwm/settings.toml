# OmniWM settings, merged into ~/.config/omniwm/settings.toml by
# modules/wm/omniwm.nix (mergetools). Values only -- the merge reads the file
# OmniWM wrote and layers the values below onto it with yq, so comments here do
# not reach the live file.
#
# The whole document is here on purpose: OmniWM validates settings.toml as a
# unit, so a partial file is rejected outright and it starts on defaults (see
# settings.toml.corrupt in ~/.config/omniwm). This is the file OmniWM wrote
# itself, with the values below edited in place -- add values, do not delete
# keys, and diff against a freshly generated one after an OmniWM upgrade.
#
# Unlike the symlink this replaced, the live file stays OmniWM's: keys it adds
# (a new schema after an upgrade) survive a switch, keys named here win, so
# mirror GUI changes you want to keep back into this file.

schemaVersion = 5

[appearance]
mode = "automatic"
tabRailAppIcons = false

[borders]
enabled = true
width = 4.0

[borders.color]
alpha = 1.0
blue = 0.82
green = 0.576
red = 0.467

[clipboard]
historyEnabled = false
ignoredTypes = []
maxItemBytes = 8388608
maxItems = 200
maxTotalBytes = 67108864

[dwindle]
defaultSplitRatio = 1.0
moveToRootStable = true
singleWindowFit = "fill"
smartSplit = false
splitWidthMultiplier = 1.0
useGlobalGaps = true

[focus]
crossesMonitorAtEdge = false
edgeNavigationInterval = 1.5
followsMouse = true
followsMouseOnlyFullyVisible = false
followsWindowToMonitor = true
lockModifier = "off"
moveCrossesMonitorAtEdge = false
moveMouseToFocusedWindow = true
raiseOnMouseFocus = true

[gaps]
fullscreenUsesOuterGaps = false
size = 10.0

[gaps.outer]
