# Read by OmniWM, not by init.luau: the capabilities line is what admits the
# widget's omniwm.http calls to api.github.com (an undeclared host fails with
# network_denied), and the [options.*] tables are what the native options editor
# shows. Values the user types are saved for the style, in [widgets.github] of
# ~/.config/omniwm/shell/<profile>/shell.toml, so the token never lands here.

capabilities = { network = ["api.github.com"], purpose = "Shows your unread GitHub notifications; marks pull requests that are already closed as read." }

[options.token]
type = "string"
title = "GitHub token (notifications scope)"
maxLength = 512

[options.interval]
type = "number"
title = "Poll interval (seconds)"
default = 120
min = 30
max = 3600
step = 10

[options.dismissClosed]
type = "boolean"
title = "Mark closed pull requests read"
default = true
